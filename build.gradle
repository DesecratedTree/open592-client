plugins {
    id 'java'
}

group = 'com.rs'
version = '592'

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = [
                'src/client/src/main/java',
                'src/loader/src/main/java',
                'template/deob-annotations/src/main/java',
                'template/jdk-stubs/src/main/java'
            ]
        }
    }
    // Isolated client-only compilation. The client tree declares Signlink
    // while the loader tree declares SignLink: distinct JVM names, but the
    // same .class filename on case-insensitive filesystems, so the shared
    // main output keeps only one of them and ClientLoader fails at runtime
    // with NoClassDefFoundError: Signlink (wrong name: SignLink).
    // The client tree references no loader-tree class (verified), so it
    // compiles and runs standalone from its own output directory.
    client {
        java {
            srcDirs = [
                'src/client/src/main/java',
                'template/deob-annotations/src/main/java',
                'template/jdk-stubs/src/main/java'
            ]
        }
    }
    test {
        java {
            srcDirs = ['src/client/src/test/java']
        }
    }
}

// Java 8 target: the loader uses java.util.jar.Pack200, which only exists
// in the Java 8 API, and the deobfuscated sources are Java 6-era code.
// --release exists only on JDK 9+ javac, so fall back to source/target 1.8
// when the build itself runs on a JDK 8 (Gradle 8.x supports JVM 8).
def releaseEight = JavaVersion.current().isJava9Compatible()
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (releaseEight) {
        options.release = 8
    } else {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
}

// LWJGL HD renderer (always-on high-detail toolkit): BOM-aligned modules.
// lwjgl3-awt 0.2.3 was built against LWJGL 3.3.5, the closest 3.3.x pairing
// for LWJGL 3.3.6; both target Java 8. Newer lwjgl3-awt releases track
// LWJGL 3.4.x, so stay on this pair until the whole build leaves Java 8.
def lwjglVersion = '3.3.6'
def lwjglAwtVersion = '0.2.3'
// Natives for every supported desktop OS so the same build (and the fat
// client jar, which bundles the client runtime classpath) runs anywhere.
// LWJGL picks the current platform's jar at runtime; the rest stay inert.
def lwjglNatives = [
    'natives-windows',
    'natives-windows-arm64',
    'natives-linux',
    'natives-linux-arm64',
    'natives-macos',
    'natives-macos-arm64'
]

dependencies {
    // Stubs for the Microsoft/Netscape classes the client references
    // (same jar the matcher runs use as shared classpath).
    implementation files('src/lib/stub.jar')
    clientImplementation files('src/lib/stub.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-jawt'
    implementation 'org.lwjgl:lwjgl-opengl'
    // transitive=false: the awt POM carries a non-optional dependency with
    // a literal ${lwjgl.natives} classifier, fed only by Maven OS profiles
    // that Gradle does not apply, which breaks resolution. The modules it
    // needs (lwjgl, lwjgl-jawt, lwjgl-opengl) are declared explicitly above
    // and version-aligned by the BOM, so nothing is lost.
    implementation("org.lwjglx:lwjgl3-awt:${lwjglAwtVersion}") {
        transitive = false
    }
    clientImplementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    clientImplementation 'org.lwjgl:lwjgl'
    clientImplementation 'org.lwjgl:lwjgl-jawt'
    clientImplementation 'org.lwjgl:lwjgl-opengl'
    clientImplementation("org.lwjglx:lwjgl3-awt:${lwjglAwtVersion}") {
        transitive = false
    }
    lwjglNatives.each { classifier ->
        runtimeOnly "org.lwjgl:lwjgl::${classifier}"
        runtimeOnly "org.lwjgl:lwjgl-opengl::${classifier}"
        clientRuntimeOnly "org.lwjgl:lwjgl::${classifier}"
        clientRuntimeOnly "org.lwjgl:lwjgl-opengl::${classifier}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Shared launch setup for the client run profile: the isolated client
// output, Java 8 (the deob is Java 6-era code: Applet, Pack200; compilation
// targets Java 8 either via --release or source/target 1.8). The HD toolkit
// is LWJGL (Maven natives, see dependencies above); the legacy jaclib/jaggl
// path survives only inside GlToolkit for reference and is no longer used.
def osName = System.getProperty('os.name').toLowerCase()
def configureClientRun = { JavaExec task, String description ->
    task.group = 'application'
    task.description = description
    task.classpath = sourceSets.client.runtimeClasspath
    task.mainClass = 'com.jagex.game.runetek5.ClientLoader'
    task.jvmArgs = ['-Xmx512m', '-Dsun.java2d.noddraw=true']
    task.javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    // jawt.dll (linked by the Windows natives) must resolve to the JRE's
    // copy. java.home is the JDK root under Java 8 and the runtime image on
    // later JVMs, so check <home>/jre/bin before <home>/bin.
    if (osName.startsWith('windows')) {
        task.doFirst {
            def javaHome = task.javaLauncher.get().metadata.installationPath.asFile
            def jreBin = new File(javaHome, 'jre/bin')
            if (!jreBin.isDirectory()) {
                jreBin = new File(javaHome, 'bin')
            }
            task.environment 'PATH', jreBin.absolutePath + File.pathSeparator + System.getenv('PATH')
        }
    }
}

tasks.register('runClient', JavaExec) {
    configureClientRun(it, 'Runs the 592 client loader from the isolated client output.')
}

// Runnable fat client jar (client classes + stub.jar) written to the project
// root as client-current.jar, mirroring the server's single-artifact build.
tasks.register('clientJar', Jar) {
    group = 'application'
    description = 'Builds a runnable client jar at the project root (client-current.jar).'
    dependsOn 'clientClasses'
    archiveFileName = 'client-current.jar'
    destinationDirectory = project.rootDir
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.jagex.game.runetek5.ClientLoader'
    }
    from sourceSets.client.output
    from {
        configurations.clientRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.named('assemble') {
    dependsOn 'clientJar'
}
